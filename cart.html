<!DOCTYPE html>
<html>
<head>
    <title>Your Cart</title>
    <style>
        body { font-family: Arial; background: #fff8f2; padding: 40px; }
        table { width: 60%; margin: auto; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ccc; text-align: center; }
        th { background: #2c1a0f; color: white; }
        h2 { text-align: center; }
        button {
            padding: 8px 15px;
            background: gold;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .center { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

<h2>🛒 Your Cart</h2>

<table>
    <tr>
        <th>Product</th>
        <th>Price</th>
    </tr>
    {% for item in cart_items %}
    <tr>
        <td>{{ item.name }}</td>
        <td>₹{{ item.price }}</td>
    </tr>
    {% endfor %}
    <tr>
        <th>Total</th>
        <th>₹{{ total }}</th>
    </tr>
</table>

<div class="center">
    <a href="/checkout"><button>Checkout</button></a>
    <a href="/clear"><button>Clear Cart</button></a>
    <a href="/"><button>Continue Shopping</button></a>
</div>

</body>
</html>
