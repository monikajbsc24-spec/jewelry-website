<!DOCTYPE html>
<html>
<head>
    <title>Elegance Jewels</title>
    <style>
        body { font-family: Arial; margin: 0; background: #fff8f2; }
        header { background: #2c1a0f; color: white; padding: 20px; text-align: center; }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            padding: 40px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
        }
        button {
            margin-top: 10px;
            padding: 8px 15px;
            background: gold;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .cart-link {
            color: white;
            float: right;
            margin-top: -30px;
            margin-right: 20px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h2>Elegance Jewels</h2>
    <a class="cart-link" href="/cart">🛒 View Cart</a>
</header>

<div class="products">
    {% for p in products %}
    <div class="card">
        <img src="{{ p.image }}">
        <h3>{{ p.name }}</h3>
        <p>₹{{ p.price }}</p>
        <a href="/add/{{ p.id }}"><button>Add to Cart</button></a>
    </div>
    {% endfor %}
</div>

</body>
</html>
